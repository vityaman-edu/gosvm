---
repos:
  - repo: local
    hooks:

      - id: markdown
        name: Markdown Lint
        entry: bash scripts/precommit/md/all.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: yaml
        name: YAML Lint
        entry: bash scripts/precommit/yaml/all.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: shell
        name: Shell Lint
        entry: bash scripts/precommit/shell/all.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: nix
        name: Nix Lint
        entry: bash scripts/precommit/nix/all.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: go
        name: Go Lint
        entry: bash scripts/precommit/go/lint.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: go-build
        name: Go Build
        entry: bash scripts/precommit/go/build.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: go-test
        name: Go Test
        entry: bash scripts/precommit/go/test.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: go-scan
        name: Go Scan
        entry: bash scripts/precommit/go/scan.sh
        language: system
        pass_filenames: false
        always_run: true
