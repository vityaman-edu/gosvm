---
version: '2'
run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
linters:
  default: all
  disable:
    - exhaustruct
    - gomodguard
    - wsl
  settings:
    forbidigo:
      forbid:
        - pattern: '^(print|println)$'
          msg: Use the standard fmt package for command-line output.
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
    staticcheck:
      checks: ['all']
    revive:
      enable-all-rules: true
    gocritic:
      enable-all: true
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets: []
    warn-unused: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
formatters:
  enable:
    - gofumpt
    - goimports
