---
version: '2'
run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
linters:
  default: all
  disable:
    - exhaustruct
    - gomodguard
    - wsl
    - depguard
  settings:
    forbidigo:
      forbid:
        - pattern: '^(print|println)$'
          msg: Use the standard fmt package for command-line output.
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustive:
      default-signifies-exhaustive: true
    govet:
      enable-all: true
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - '^github\.com/ebukreev/go-z3/z3\.Value$'
    staticcheck:
      checks: ['all', '-ST1000']
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    gocritic:
      enable-all: true
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets: []
    warn-unused: false
    paths:
      - '(^|/)examples(/|$)'
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    paths:
      - '(^|/)examples(/|$)'
